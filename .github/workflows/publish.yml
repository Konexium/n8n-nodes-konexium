# Publishes to npm with provenance when a GitHub release is published.
# n8n requires this for community-node verification (since 1 May 2026).
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance and trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Staged publishing (and trusted publishing) need a recent npm CLI.
      - run: npm install -g npm@11.21.1
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint
      # A brand-new package can only be staged: its first version waits on
      # npmjs.com until a maintainer approves it with 2FA. Later versions
      # publish directly through the trusted publisher.
      - name: Publish (or stage the first version)
        run: |
          if npm view "$(node -p "require('./package.json').name")" version >/dev/null 2>&1; then
            npm publish --provenance --access public
          else
            npm stage publish --provenance --access public
          fi
        env:
          # Only for the first release. Delete the secret once the trusted
          # publisher is linked on npmjs.com.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
