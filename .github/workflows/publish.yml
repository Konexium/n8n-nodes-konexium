# Publishes to npm with provenance when a GitHub release is published.
# n8n requires this for community-node verification (since 1 May 2026).
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance and trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (no stored token) needs npm 11.5.1 or later.
      - run: npm install -g npm@11.5.1
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint
      - run: npm publish --provenance --access public
        env:
          # Only for the very first release, if npm does not yet allow a trusted
          # publisher on a package that doesn't exist. Delete the secret afterwards.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
